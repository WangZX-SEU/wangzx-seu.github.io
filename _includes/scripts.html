<!-- FeedPulse 访客追踪（轻量，不可见） -->
<script>
(function() {
  var sid = 'b4a70c95-7b53-4412-93a1-ff927be7108d';
  var k = '_fp_ignore_' + sid;
  try { if (localStorage.getItem(k) === '1') return; } catch(e) {}
  var data = {
    referrer: document.referrer || 'direct',
    landing_page: location.pathname || '/',
    title: document.title || '',
    host: location.host,
    session_id: (function() {
      var s = '_fp_sid_' + sid;
      var v = sessionStorage.getItem(s);
      if (!v) { v = Math.random().toString(36).slice(2, 14); sessionStorage.setItem(s, v); }
      return v;
    })()
  };
  navigator.sendBeacon && navigator.sendBeacon('https://feed-pulse.com/api/track/' + sid,
    new Blob([JSON.stringify(data)], {type: 'application/json'}));
})();
</script>
